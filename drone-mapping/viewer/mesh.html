<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>3D 매핑 보기 (시험)</title>
<style>html,body{margin:0;height:100%;background:#1b1f26;overflow:hidden;font:12px 'Malgun Gothic',sans-serif;color:#ddd}
canvas{width:100%;height:100%;display:block;cursor:grab}#info{position:absolute;left:10px;top:8px;background:#0008;padding:4px 8px;border-radius:6px}</style></head>
<body><canvas id="c"></canvas><div id="info">불러오는 중…</div>
<script>
(async function () {
  'use strict';
  const Q = new URLSearchParams(location.search), base = Q.get('src') || 'web/';
  const cv = document.getElementById('c'), info = document.getElementById('info');
  const gl = cv.getContext('webgl2', { antialias: true });
  const meta = await (await fetch(base + 'mesh.json')).json();
  const buf = await (await fetch(base + 'mesh.bin')).arrayBuffer();
  const nv = meta.verts, nt = meta.tris;
  const pos = new Float32Array(buf, 0, nv * 3), uv = new Float32Array(buf, nv * 12, nv * 2), idx = new Uint32Array(buf, nv * 20, nt * 3);
  const img = new Image(); img.src = base + 'tex.jpg'; await img.decode();
  const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(o); return o; };
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, `#version 300 es
    in vec3 p; in vec2 t; uniform mat4 M; uniform float flip; out vec2 vt; void main(){ vt = vec2(t.x, flip > 0.5 ? 1.0 - t.y : t.y); gl_Position = M * vec4(p, 1.0); }`));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, `#version 300 es
    precision highp float; in vec2 vt; uniform sampler2D tex; out vec4 o; void main(){ o = vec4(texture(tex, vt).rgb, 1.0); }`));
  gl.linkProgram(pr); gl.useProgram(pr);
  const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  const b1 = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b1); gl.bufferData(gl.ARRAY_BUFFER, pos, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.bindAttribLocation(pr, 0, 'p'); gl.vertexAttribPointer(gl.getAttribLocation(pr, 'p'), 3, gl.FLOAT, false, 0, 0);
  const b2 = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b2); gl.bufferData(gl.ARRAY_BUFFER, uv, gl.STATIC_DRAW);
  const lt = gl.getAttribLocation(pr, 't'); gl.enableVertexAttribArray(lt); gl.vertexAttribPointer(lt, 2, gl.FLOAT, false, 0, 0);
  const ib = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);
  const tx = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tx);
  // 질감이 그래픽 한도(MAX_TEXTURE_SIZE)보다 크면 줄여서 올림
  const mx = gl.getParameter(gl.MAX_TEXTURE_SIZE);
  let src = img;
  if (img.width > mx || img.height > mx) {
    const k = mx / Math.max(img.width, img.height), cvs = document.createElement('canvas');
    cvs.width = Math.floor(img.width * k); cvs.height = Math.floor(img.height * k);
    cvs.getContext('2d').drawImage(img, 0, 0, cvs.width, cvs.height); src = cvs;
  }
  window.__tex = [img.width, img.height, mx, src.width];
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, src); gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.enable(gl.DEPTH_TEST);
  // 궤도 카메라 (z 위) — 방위 · 내려다보는 각 · 거리 · 바라보는 점
  const c = [(meta.min[0] + meta.max[0]) / 2, (meta.min[1] + meta.max[1]) / 2, (meta.min[2] + meta.max[2]) / 2];
  const V = { az: +(Q.get('az') || 30), el: +(Q.get('el') || 35), d: +(Q.get('d') || Math.hypot(meta.max[0] - meta.min[0], meta.max[1] - meta.min[1]) * 0.9), tgt: c };
  function mat() {
    const W = cv.width = cv.clientWidth * devicePixelRatio, H = cv.height = cv.clientHeight * devicePixelRatio;
    gl.viewport(0, 0, W, H);
    const a = V.az * Math.PI / 180, e = V.el * Math.PI / 180;
    const eye = [V.tgt[0] + V.d * Math.cos(e) * Math.sin(a), V.tgt[1] - V.d * Math.cos(e) * Math.cos(a), V.tgt[2] + V.d * Math.sin(e)];
    const f = norm(sub(V.tgt, eye)), r = norm(cross(f, [0, 0, 1])), u = cross(r, f);
    const view = [r[0], u[0], -f[0], 0, r[1], u[1], -f[1], 0, r[2], u[2], -f[2], 0, -dot(r, eye), -dot(u, eye), dot(f, eye), 1];
    const n = Math.max(0.1, V.d * 0.01), fa = V.d * 20, fy = 1 / Math.tan(25 * Math.PI / 180), as = W / H;
    const proj = [fy / as, 0, 0, 0, 0, fy, 0, 0, 0, 0, (fa + n) / (n - fa), -1, 0, 0, 2 * fa * n / (n - fa), 0];
    return mul(proj, view);
  }
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const norm = (a) => { const l = Math.hypot(...a); return [a[0] / l, a[1] / l, a[2] / l]; };
  function mul(A, B) { const C = new Array(16).fill(0); for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) for (let k = 0; k < 4; k++) C[j * 4 + i] += A[k * 4 + i] * B[j * 4 + k]; return C; }
  function draw() {
    gl.clearColor(0.106, 0.122, 0.149, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.uniformMatrix4fv(gl.getUniformLocation(pr, 'M'), false, mat()); gl.uniform1f(gl.getUniformLocation(pr, 'flip'), Q.get('flip') === '1' ? 1 : 0);
    gl.drawElements(gl.TRIANGLES, nt * 3, gl.UNSIGNED_INT, 0);
    window.__drawn = (window.__drawn || 0) + 1;
  }
  let dn = null;
  cv.addEventListener('pointerdown', (e) => { dn = { x: e.clientX, y: e.clientY, b: e.button, az: V.az, el: V.el, t: V.tgt.slice() }; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', (e) => {
    if (!dn) return; const dx = e.clientX - dn.x, dy = e.clientY - dn.y;
    if (dn.b === 2 || e.shiftKey) { const a = V.az * Math.PI / 180, k = V.d / cv.clientHeight; V.tgt = [dn.t[0] - (dx * Math.cos(a) - dy * Math.sin(a)) * k, dn.t[1] - (dx * Math.sin(a) + dy * Math.cos(a)) * k, dn.t[2]]; }
    else { V.az = dn.az - dx * 0.3; V.el = Math.max(5, Math.min(89, dn.el + dy * 0.3)); }
    draw();
  });
  cv.addEventListener('pointerup', () => { dn = null; });
  cv.addEventListener('contextmenu', (e) => e.preventDefault());
  cv.addEventListener('wheel', (e) => { e.preventDefault(); V.d *= e.deltaY > 0 ? 1.15 : 1 / 1.15; draw(); }, { passive: false });
  window.addEventListener('resize', draw);
  info.textContent = '세모 ' + nt.toLocaleString() + ' · 원점 ' + meta.origin.join(', ') + ' (EPSG:5186 · EGM2008)';
  draw();
  window.__view = V; window.__draw = draw;
})().catch((e) => { document.getElementById('info').textContent = '오류 · ' + e; window.__err = String(e); });
</script></body></html>
