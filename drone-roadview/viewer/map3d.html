<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D 매핑 · 드론 로드뷰</title>
<style>
/* 360 보기 화면 (viewer/style.css) 과 같은 모양 · 결과 폴더엔 이 파일과 map3d.js 만 복사되므로 여기에 넣음 */
:root {
  --bg: #181818; --panel: #1f1f1f; --panel-2: #2b2b2b; --panel-3: #363636;
  --line: rgba(255, 255, 255, 0.06); --line-2: rgba(255, 255, 255, 0.1);
  --text: #e9e9e9; --dim: #8b8b8b; --acc: #2f81f7; --acc-soft: rgba(47, 129, 247, 0.22); --yel: #facc15;
  --r: 8px; --r-s: 6px;
  --font: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: #1b1f26; color: var(--text); font: 13px/1.35 var(--font); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#c, #ov { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#c { cursor: grab; }
#c.drag { cursor: grabbing; }
#c.point:not(.drag) { cursor: pointer; }
#c.move:not(.drag) { cursor: move; }
#c.pick:not(.drag) { cursor: crosshair; }
#ov { pointer-events: none; }

/* 윗줄 */
#top { position: absolute; left: 10px; top: 10px; right: 10px; display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 7px 0 8px;
  background: rgba(31, 31, 31, .92); border-radius: var(--r); backdrop-filter: blur(6px); overflow-x: auto; overflow-y: hidden; scrollbar-width: none; z-index: 3; }
#top::-webkit-scrollbar { display: none; }
.brand { display: flex; align-items: center; gap: 9px; min-width: 0; flex: 0 1 auto; }
.logo { flex: none; width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #9cc9ff, var(--acc) 60%, #173a73); }
#title { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 30vw; }
.spacer { flex: 1; min-width: 8px; }
.tools { display: flex; align-items: center; gap: 2px; flex: none; }
.tools.host { padding-right: 8px; margin-right: 6px; border-right: 1px solid var(--line-2); }
.ib { flex: none; width: 32px; height: 32px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: var(--r-s);
  background: transparent; color: #bdbdbd; transition: background .12s, color .12s; }
.ib svg { width: 19px; height: 19px; }
.ib:hover { background: var(--panel-2); color: #fff; }
.ib.on { background: var(--acc-soft); color: #fff; }
.ib.on svg { color: #8bb8ff; }
.ib.s { width: 26px; height: 26px; }
.ib.s svg { width: 16px; height: 16px; }
.ib:disabled { opacity: .4; pointer-events: none; }
.tg { height: 26px; padding: 0 10px; border: 0; border-radius: var(--r-s); background: var(--panel-2); color: var(--dim); font-weight: 600; font-size: 12px; white-space: nowrap; transition: background .12s, color .12s; }
.tg:hover { color: var(--text); background: var(--panel-3); }
.tg.on { background: var(--acc-soft); color: #fff; }
.numbox { display: flex; align-items: center; gap: 6px; height: 28px; color: var(--dim); font-weight: 600; font-size: 12px; white-space: nowrap; }
.numbox input[type=number] { margin-left: auto; }
input[type=number] { -moz-appearance: textfield; appearance: textfield; width: 52px; height: 24px; padding: 0 6px; background: var(--bg); border: 1px solid var(--line-2); border-radius: 5px; outline: none; text-align: right; font-variant-numeric: tabular-nums; }
input[type=number]:focus { border-color: var(--acc); }
input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.tag { flex: none; padding: 1px 7px; border-radius: 999px; background: rgba(250, 204, 21, .13); color: #e7c35a; font-size: 11px; font-weight: 600; white-space: nowrap; }
.tag.user { background: var(--panel-2); color: var(--dim); }
.tag:empty { display: none; }

/* 오른쪽 칸 (지하 시설물 · 검사점) */
#side { position: absolute; right: 10px; top: 68px; width: var(--sideW, 300px); max-height: calc(100% - 78px); display: flex; flex-direction: column; gap: 10px; overflow-y: auto; z-index: 2; scrollbar-width: thin; }
.pane { flex: none; position: relative; background: rgba(31, 31, 31, .94); border-radius: var(--r); backdrop-filter: blur(6px); }
#ugPane { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 8px; }
.ugHead { display: flex; align-items: center; gap: 8px; height: 26px; }
.ugHead b { font-size: 13px; }
.ugHead .ib.s { margin-left: auto; }
.ugHead .ib.s + .ib.s { margin-left: 0; }
.seg4 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.seg4 button { height: 48px; padding: 4px 2px 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 0; border-radius: var(--r-s); background: var(--panel-2); color: var(--dim); font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.seg4 button svg { width: 21px; height: 21px; stroke-width: 1.8; }
.seg4 button:hover { color: var(--text); background: var(--panel-3); }
.seg4 button.on { background: var(--acc); color: #fff; }
.seg4.off { opacity: .45; }
.seg4 button.act { box-shadow: inset 0 0 0 1px var(--line-2); background: transparent; }
.seg4 button.act.on { background: var(--acc-soft); color: #fff; }
.tg .sw { display: inline-block; width: 14px; height: 8px; margin-right: 6px; vertical-align: 0; border-radius: 2px; }
.tg .sw.tmp { background: rgba(255, 154, 31, .22); border: 1.5px dashed #ff9a1f; }
.tg .sw.perm { background: #00b8d4; }
.tg:not(.on) .sw { opacity: .35; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.seg3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.seg3 button { height: 44px; padding: 4px 2px 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 0; border-radius: var(--r-s); background: var(--panel-2); color: var(--dim); font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.seg3 button svg { width: 20px; height: 20px; stroke-width: 1.8; }
.seg3 button:hover { color: var(--text); background: var(--panel-3); }
.seg3 button.on { background: var(--yel); color: #11141a; }
#shList { display: flex; flex-direction: column; gap: 3px; margin-top: 6px; max-height: 104px; overflow-y: auto; }
#shList:empty { display: none; }
.shRow { display: flex; align-items: center; gap: 6px; flex: none; height: 26px; padding: 0 2px 0 8px; background: var(--panel-2); border-radius: 5px; box-shadow: inset 3px 0 0 var(--c, var(--dim)); }
.shRow select { height: 22px; max-width: 128px; padding: 0 2px; background: var(--bg); border: 1px solid var(--line-2); border-radius: 4px; font-size: 11.5px; }
.shGo { flex: 1; min-width: 0; height: 22px; padding: 0 2px; border: 0; background: transparent; text-align: left; font-size: 11.5px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shGo:hover { color: #fff; text-decoration: underline; }
.shDel { flex: none; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--dim); font-size: 14px; line-height: 1; }
.shDel:hover { background: var(--panel-3); color: var(--text); }
.cl { color: var(--dim); font-weight: 600; white-space: nowrap; }
.cb { width: 28px; height: 26px; padding: 0; border: 0; border-radius: 5px; background: var(--panel-2); font-size: 15px; font-weight: 700; line-height: 1; user-select: none; }
.cb:hover { background: var(--panel-3); }
.cb:active { background: var(--acc); }
.cu { color: var(--dim); }

/* 검사점 */
#ck { padding: 8px 10px 10px; display: flex; flex-direction: column; max-height: 50vh; }
#ck .ckh { display: flex; align-items: center; gap: 8px; height: 26px; margin-bottom: 6px; }
#ck .ckh b { color: #ffb86b; }
#ckRms { flex: 1; color: var(--dim); font-size: 11.5px; }
#ck .ckl { overflow: auto; flex: 1; }
#ck .ci { display: flex; gap: 6px; padding: 4px 6px; border-radius: 5px; cursor: pointer; font-size: 12px; color: #ccc; }
#ck .ci:hover { background: var(--panel-2); }
#ck .ci.on { outline: 1px solid #ff9a1f; background: #2a2014; color: #fff; }
#ck .ci .nm { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#ck .ci .r { color: #9fb6d8; font-family: Consolas, monospace; font-size: 11px; }
#ck .row { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
#ckHint { color: var(--dim); font-size: 11px; }
#ck .x { width: 24px; height: 24px; padding: 0; border: 0; border-radius: 5px; background: transparent; color: var(--dim); font-size: 16px; line-height: 1; }
#ck .x:hover { background: var(--panel-3); color: var(--text); }
#ckSave { height: 28px; padding: 0 12px; border: 0; border-radius: var(--r-s); background: var(--acc); color: #fff; font-weight: 600; }

/* 아래 안내 줄 (고치기 · 가시설) */
#edChip, #shChip { position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%); display: none; align-items: center; gap: 8px; height: 36px; padding: 0 6px 0 14px; max-width: calc(100% - 24px);
  background: rgba(24, 24, 24, .88); border-radius: 999px; backdrop-filter: blur(6px); white-space: nowrap; font-variant-numeric: tabular-nums; z-index: 3; }
#edChip { box-shadow: inset 0 0 0 1px rgba(34, 211, 238, .6); }
#edChip.show, #shChip.show { display: flex; }
#shChip { box-shadow: inset 0 0 0 1px rgba(242, 179, 61, .7); }
#shTip { color: var(--yel); }
#shName { color: var(--dim); }
#shChip button, #edChip button { flex: none; height: 26px; padding: 0 12px; border: 0; border-radius: 999px; background: var(--panel-2); color: var(--text); font-weight: 600; }
#shChip button:hover, #edChip button:hover { background: var(--panel-3); }
#edChip button:disabled { opacity: .5; pointer-events: none; }
#edTip { color: var(--text); min-width: 0; overflow: hidden; text-overflow: ellipsis; }
#edChip #edEnd { background: #22d3ee; color: #11141a; font-weight: 700; }
#edChip #edEnd:hover { filter: brightness(1.1); }

/* 관 정보 */
.card { position: absolute; padding: 6px 10px 10px; background: rgba(24, 24, 24, .94); border-radius: var(--r); box-shadow: 0 10px 30px rgba(0, 0, 0, .45); font-size: 12px; font-variant-numeric: tabular-nums; z-index: 4; }
.cHead { display: flex; align-items: center; gap: 8px; height: 28px; }
.cHead b { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.card .x { margin-left: auto; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 5px; background: transparent; color: var(--dim); font-size: 16px; line-height: 1; }
.card .x:hover { background: var(--panel-3); color: var(--text); }
.card .ib.s { margin-left: auto; }
.card .ib.s + .x { margin-left: 0; }
.kv { display: grid; grid-template-columns: auto auto; gap: 3px 14px; }
.kv .k { color: var(--dim); white-space: nowrap; }
.kv .v { text-align: right; white-space: nowrap; }
#pipeCard { width: 236px; }
.pcMat { display: inline-flex; gap: 2px; justify-content: flex-end; }
.pcMat button { height: 20px; padding: 0 6px; border: 0; border-radius: 4px; background: var(--panel-2); color: var(--dim); font-size: 11px; font-weight: 600; }
.pcMat button:hover { color: var(--text); }
.pcMat button.on { background: var(--acc); color: #fff; }

/* 수량 · 지장물 간섭 (왼쪽 위) */
#qtyBox { position: absolute; left: 10px; top: 68px; width: 250px; max-width: calc(100% - 24px); max-height: calc(100% - 110px); overflow-y: auto; padding: 6px 10px 10px;
  background: rgba(24, 24, 24, .9); border-radius: var(--r); backdrop-filter: blur(6px); font-size: 12px; font-variant-numeric: tabular-nums; z-index: 2; }
.qHead { display: flex; align-items: center; gap: 8px; height: 28px; }
.qHead b { font-size: 13px; }
#qLine { flex: 1; min-width: 0; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#qX { width: 24px; height: 24px; padding: 0; border: 0; border-radius: 5px; background: transparent; color: var(--dim); font-size: 16px; line-height: 1; }
#qX:hover { background: var(--panel-3); color: var(--text); }
#qTab { display: grid; grid-template-columns: auto 1fr 1fr; gap: 3px 10px; margin-top: 2px; }
#qTab .qh { color: var(--dim); text-align: right; font-size: 11px; }
#qTab .ql { color: var(--dim); white-space: nowrap; }
#qTab .qv { text-align: right; white-space: nowrap; }
#qNote { margin-top: 5px; color: var(--dim); font-size: 11px; }
#qNote:empty { display: none; }
#qClr { display: flex; align-items: center; gap: 10px; margin-top: 8px; padding-top: 7px; border-top: 1px solid var(--line); }
#qClr label { display: flex; align-items: center; gap: 5px; color: var(--dim); font-weight: 600; }
#qClr input[type=number] { width: 48px; }
#qHit { margin-left: auto; color: #4ade80; }
#qHit.bad { color: #f87171; }
#qList { display: flex; flex-direction: column; gap: 3px; margin-top: 6px; max-height: 132px; overflow-y: auto; }
#qList:empty { display: none; }
#qList button { height: 24px; padding: 0 8px; border: 0; border-radius: 5px; background: var(--panel-2); text-align: left; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#qList button:hover { background: var(--panel-3); box-shadow: inset 0 0 0 1px #f87171; }

/* 창 (관로 넣기 · 지장물 넣기 · 터파기 설정) */
#dlgBack { position: fixed; inset: 0; z-index: 9; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0, 0, 0, .55); }
.dlg { width: min(380px, 100%); max-height: 100%; overflow-y: auto; background: #222; border-radius: 10px; box-shadow: 0 16px 40px rgba(0, 0, 0, .55); }
.dlgHead { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 8px 0 16px; }
.dlgHead b { flex: 1; font-size: 14px; }
.dlgX { width: 30px; height: 30px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--dim); font-size: 20px; line-height: 1; }
.dlgX:hover { background: var(--panel-3); color: var(--text); }
.dlgBody { display: flex; flex-direction: column; gap: 10px; padding: 4px 16px 14px; }
.dlgFoot { display: flex; justify-content: flex-end; gap: 8px; padding: 0 16px 14px; }
#pipeDlg .dlgFoot { justify-content: space-between; }
.dlg button:not(.dlgX) { height: 30px; padding: 0 14px; border: 0; border-radius: var(--r-s); background: var(--panel-2); font-weight: 600; white-space: nowrap; }
.dlg button:not(.dlgX):hover { background: var(--panel-3); }
.dlg button.primary { background: var(--acc); color: #fff; }
.dlg button.primary:hover { background: var(--acc); filter: brightness(1.1); }
.dlg button:disabled { opacity: .5; pointer-events: none; }
.fileRow { display: flex; align-items: center; gap: 10px; min-width: 0; }
#pmFile, #omFile { min-width: 0; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fields { display: flex; flex-direction: column; gap: 8px; }
.fields label { display: grid; grid-template-columns: 1fr 160px; align-items: center; gap: 10px; color: var(--dim); font-weight: 600; }
.fields select, .fields input { width: 100%; height: 30px; padding: 0 8px; background: var(--bg); border: 1px solid var(--line-2); border-radius: 6px; outline: none; color: var(--text); font: inherit; text-align: left; }
.fields select:focus, .fields input:focus { border-color: var(--acc); }
.hint { color: var(--dim); font-size: 12px; }
.hint:empty, .err:empty { display: none; }
.fields .hint { margin-top: -4px; text-align: right; }
.err { color: #f87171; font-weight: 600; }
#secDlg { position: fixed; right: 18px; top: 66px; z-index: 8; width: min(408px, calc(100% - 24px)); max-height: calc(100% - 78px); }
#secDlg .dlgHead b { flex: none; }
#secDlg .dlgHead .dlgX { margin-left: auto; }
.secTop { display: flex; align-items: center; gap: 14px; }
.secTop label { display: flex; align-items: center; gap: 8px; color: var(--dim); font-weight: 600; }
#secDia { height: 28px; padding: 0 8px; background: var(--bg); color: var(--text); border: 1px solid var(--line-2); border-radius: 6px; font: inherit; outline: none; }
.secTop .chk { margin-left: auto; color: var(--text); cursor: pointer; }
.chk input { width: 16px; height: 16px; margin: 0; accent-color: var(--acc); }
#secSvg { width: 100%; height: auto; display: block; background: #141414; border-radius: 6px; stroke: none; stroke-width: 1; }
#secRows { display: grid; grid-template-columns: 1fr auto auto auto 18px; gap: 6px; align-items: center; }
#secRows input[type=number] { width: 70px; height: 26px; }
.dlg #secRows button.cb { width: 28px; height: 26px; padding: 0; font-size: 15px; }
#secDlg .dlgFoot { justify-content: space-between; }
#secDlg.off #secSvg, #secDlg.off #secRows { opacity: .45; }

#info { position: absolute; left: 10px; bottom: 10px; background: rgba(24, 24, 24, .8); padding: 5px 10px; border-radius: var(--r-s); color: #aab; font-size: 11.5px; z-index: 1; }
#load { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(24, 24, 24, .92); padding: 12px 18px; border-radius: 10px; font-weight: 600; }
#toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 12px); max-width: calc(100% - 32px); padding: 10px 16px; background: rgba(43, 43, 43, .97); border-radius: var(--r);
  box-shadow: 0 10px 30px rgba(0, 0, 0, .45); font-weight: 600; font-variant-numeric: tabular-nums; opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; z-index: 10; }
#toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
body.edOn #toast, body.shOn #toast { bottom: 90px; }
#toast.click { cursor: pointer; }
#toast button { margin-left: 12px; height: 26px; padding: 0 12px; border: 0; border-radius: 999px; background: var(--acc); color: #fff; font-weight: 700; }
/* 오른쪽 메뉴 (오른쪽 눌렀다 떼기 · JACK 1126) */
#ctxMenu { position: fixed; z-index: 11; min-width: 208px; max-width: 290px; padding: 4px; background: rgba(31, 31, 31, .97); border-radius: var(--r);
  box-shadow: 0 10px 30px rgba(0, 0, 0, .5), inset 0 0 0 1px var(--line-2); overflow-y: auto; }
#ctxMenu .cHd { padding: 5px 8px 6px; color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#ctxMenu .ci { display: flex; align-items: center; gap: 9px; width: 100%; height: 30px; padding: 0 10px 0 8px; border: 0; border-radius: var(--r-s); background: transparent; text-align: left; white-space: nowrap; }
#ctxMenu .ci span { overflow: hidden; text-overflow: ellipsis; }
#ctxMenu .ci svg { flex: none; width: 16px; height: 16px; stroke-width: 1.8; color: #9aa3b2; }
#ctxMenu .ci:hover, #ctxMenu .ci:focus-visible { background: var(--acc-soft); outline: none; }
#ctxMenu .ci:hover svg { color: #fff; }
#ctxMenu .ci.warn:hover { background: rgba(248, 113, 113, .2); }
#ctxMenu .sep { height: 1px; margin: 4px 6px; background: var(--line-2); }
#ctxMenu .sub { display: flex; gap: 4px; padding: 2px 6px 6px 33px; }
#ctxMenu .sub button { flex: 1; height: 24px; padding: 0 6px; border: 0; border-radius: 5px; background: var(--panel-2); font-size: 11.5px; font-weight: 600; white-space: nowrap; }
#ctxMenu .sub button:hover { background: var(--panel-3); }

/* 재기 · 새 관 · 잘라내기: 아래 안내 줄 · 결과 칸 */
#msChip { position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%); display: none; align-items: center; gap: 8px; height: 36px; padding: 0 6px 0 14px; max-width: calc(100% - 24px);
  background: rgba(24, 24, 24, .9); border-radius: 999px; backdrop-filter: blur(6px); white-space: nowrap; box-shadow: inset 0 0 0 1px rgba(250, 204, 21, .6); z-index: 3; }
#msChip.show { display: flex; }
#msChip.crop { box-shadow: inset 0 0 0 1px rgba(248, 113, 113, .7); padding-left: 6px; }
#msTip { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
#msChip button { flex: none; height: 26px; padding: 0 12px; border: 0; border-radius: 999px; background: var(--panel-2); font-weight: 600; }
#msChip button:hover { background: var(--panel-3); }
#msChip button:disabled { opacity: .45; pointer-events: none; }
#msChip #msEnd { background: var(--yel); color: #11141a; }
#msChip.crop #msEnd { background: #f87171; color: #fff; }
#msSeg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 999px; background: var(--bg); }
#msSeg button { height: 24px; padding: 0 10px; background: transparent; color: var(--dim); }
#msSeg button.on { background: var(--acc); color: #fff; }
body.msOn #toast { bottom: 90px; }
#msBox { left: 10px; bottom: 38px; width: 250px; max-width: calc(100% - 20px); }
#msBox.wide { width: 420px; }
#msBox .cHead button.pb { margin-left: auto; height: 22px; padding: 0 10px; border: 0; border-radius: 999px; background: var(--panel-2); font-size: 11.5px; font-weight: 600; }
#msBox .cHead button.pb:hover { background: var(--panel-3); }
#msSegs { display: grid; grid-template-columns: auto 1fr 1fr; gap: 2px 12px; max-height: 96px; margin-top: 6px; padding-top: 5px; border-top: 1px solid var(--line); overflow-y: auto; font-size: 11.5px; }
#msSegs:empty { display: none; }
#msSegs span { text-align: right; white-space: nowrap; }
#msSegs span.h { color: var(--dim); }
#msSvg { width: 100%; height: auto; display: block; margin-top: 6px; background: #141414; border-radius: 6px; stroke: none; stroke-width: 1; }
.fields .frow { display: grid; grid-template-columns: 1fr 160px; align-items: center; gap: 10px; color: var(--dim); font-weight: 600; }
#npMat { display: flex; gap: 3px; }
#npMat button { flex: 1; height: 30px; padding: 0; background: var(--panel-2); color: var(--dim); }
#npMat button.on { background: var(--acc); color: #fff; }

/* 결과물 다듬기 (잘라내기 · DEM · 웹 공유) */
#trimBox { position: absolute; right: 10px; top: 64px; width: 300px; max-width: calc(100% - 20px); padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 8px; z-index: 5; box-shadow: 0 10px 30px rgba(0, 0, 0, .45); }
/* 오른쪽 칸 폭 손잡이 (JACK 1126 · map3d.js sideGripInit) */
#sideGrip { position: absolute; width: 8px; cursor: col-resize; z-index: 3; border-radius: 4px; }
#sideGrip:hover, #sideGrip.on { background: rgba(47, 129, 247, .35); }
#side #trimBox { position: relative; right: auto; top: auto; width: auto; max-width: none; box-shadow: none; z-index: auto; }
#trimBox .ugHead .x { margin-left: auto; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 5px; background: transparent; color: var(--dim); font-size: 16px; line-height: 1; }
#trimBox .ugHead .x:hover { background: var(--panel-3); color: var(--text); }
.tbRow { display: flex; align-items: center; gap: 8px; min-height: 26px; }
#tbState { flex: 1; min-width: 0; color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
.pb2 { flex: none; height: 26px; padding: 0 10px; border: 0; border-radius: var(--r-s); background: var(--panel-2); font-size: 12px; font-weight: 600; white-space: nowrap; }
.pb2:hover { background: var(--panel-3); }
.pb2:disabled { opacity: .45; pointer-events: none; }
#tbBtns button:disabled { opacity: .45; pointer-events: none; }
.bar { height: 6px; border-radius: 999px; background: var(--panel-3); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--acc); transition: width .3s; }
#tbProg { display: flex; flex-direction: column; gap: 5px; }
#tbProg.done .bar i { background: #22c55e; }
#tbProg.fail .bar i { background: #f87171; }
#tbProg.fail #tbLine { color: #f87171; }
#tbLine { color: var(--dim); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.urlRow { display: flex; gap: 6px; }
#tbUrl { flex: 1; min-width: 0; height: 28px; padding: 0 8px; background: var(--bg); border: 1px solid var(--line-2); border-radius: 6px; outline: none; }
#tbHint { color: var(--dim); font-size: 11px; }
#ngState { flex: 1; min-width: 0; color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
#ngState.on { color: #fca5a5; }

/* 맨땅 보기 범례 (높이 색 · 메운 곳 빗금 · 등고선) */
#dtLeg { position: absolute; left: 10px; bottom: 40px; display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; max-width: calc(100% - 20px);
  background: rgba(24, 24, 24, .86); border-radius: var(--r-s); color: #d4d4d4; font-size: 11.5px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; z-index: 1; }
#msBox:not([hidden]) ~ #dtLeg { display: none; }
#dtLeg .sw { flex: none; display: inline-block; width: 22px; height: 10px; border-radius: 2px; }
#dtLeg .sw.ramp { background: linear-gradient(90deg, #2b6b52, #6b9e5c, #d9cc80, #b8804d, #ede8e0); }
#dtLeg .sw.fill { width: 14px; margin-left: 6px; background: repeating-linear-gradient(135deg, #d2cbc6 0 2.2px, #75696e 2.2px 3.6px); }
#dtMt { display: inline-flex; align-items: center; gap: 6px; }
#dtTx { color: var(--dim); }

/* 원본 사진 */
#phBox { position: fixed; right: 18px; top: 66px; z-index: 8; width: min(760px, calc(100% - 24px)); max-height: calc(100% - 78px); display: flex; flex-direction: column; }
#phBox .dlgHead { gap: 6px; }
#phBox .dlgHead b { flex: none; }
#phBox .dlgHead .ib.s { width: 30px; height: 30px; padding: 0; background: transparent; }
#phBox .dlgHead .ib.s:hover { background: var(--panel-2); }
#phBox .dlgHead .ib.s.on { background: var(--acc-soft); }
#phBox .dlgHead .ib.s svg { width: 17px; height: 17px; }
#phName { flex: 1; min-width: 0; color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#phNum { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
#phWrap { position: relative; display: flex; align-items: center; justify-content: center; min-height: 200px; margin: 0 12px 12px; background: #111; border-radius: 6px; overflow: hidden; }
#phPic { position: relative; display: inline-block; line-height: 0; }
#phImg { display: block; max-width: 100%; max-height: calc(100vh - 170px); }
#phMark { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border: 2.5px solid #ef4444; border-radius: 50%; box-shadow: 0 0 0 2px rgba(0, 0, 0, .55), inset 0 0 0 2px rgba(0, 0, 0, .55); pointer-events: none; }
#phMsg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 8px 14px; background: rgba(24, 24, 24, .9); border-radius: 8px; font-weight: 600; white-space: nowrap; }
#phMsg:empty { display: none; }
#flat { position: fixed; inset: 66px 0 28px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
#flat img { max-width: 92%; max-height: calc(100% - 40px); object-fit: contain; background: #0c0c0c; }
#flat .fl { color: #aaa; font-size: 12.5px; }
@media (max-width: 860px) { #side { width: min(300px, calc(100% - 20px)); max-height: 45vh; top: auto; bottom: 40px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="ov"></canvas>
<header id="top">
  <button class="ib" id="bHome" type="button" title="처음 화면" aria-label="처음"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5.5 9.5V20h4.5v-6h4v6h4.5V9.5"/></svg></button>

    <button class="ib" id="hObst" type="button" title="지장물 넣기 (SHP)" aria-label="지장물 넣기"><svg viewBox="0 0 24 24"><path d="M2 12h2.5M7 12h2.5M12 12h0.5"/><path d="M2 7.5h10M2 16.5h10" opacity=".45"/><path d="M18 8v8M14 12h8"/></svg></button>
    <button class="ib" id="bTrim" type="button" title="결과물 다듬기 (잘라내기 · DEM · 웹 공유)" aria-label="결과물 다듬기"><svg viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg></button>
    <button class="ib" id="bFiles" type="button" title="결과물 폴더 (정사영상 · DSM · 지표면)" aria-label="결과물"><svg viewBox="0 0 24 24"><path d="M4 6h5l2 2h9v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/></svg></button>
  </div>
  <div class="tools">
    <button class="ib" id="tgEdit" type="button" title="관로 고치기 (Esc 끝)" aria-label="관로 고치기"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg></button>
    <button class="ib" id="tgQty" type="button" title="수량 · 간섭" aria-label="수량"><svg viewBox="0 0 24 24"><path d="M17 5H7l6 7-6 7h10"/></svg></button>
    <button class="ib on" id="bXray" type="button" title="투시 (땅 너머 관로)" aria-label="투시"><svg viewBox="0 0 24 24"><path d="M2 9h20"/><path d="M4 15h16" stroke-dasharray="2.5 2.5"/><path d="M2 9c3-4.5 17-4.5 20 0" opacity=".5"/></svg></button>
    <button class="ib" id="bCheck" type="button" title="검사점 정확도 (검사점 파일 → 3D 에서 그 점 찍기 → 잔차 · RMSE)" aria-label="검사점"><svg viewBox="0 0 24 24"><path d="M12 3 4 21h16z"/><path d="M12 10v5"/></svg></button>
    <button class="ib" id="bDtm" type="button" title="맨땅 보기 (나무 · 건물 뺀 땅 · DTM)" aria-label="맨땅" hidden><svg viewBox="0 0 24 24"><path d="M2 19l6-9 4 5 3-4 7 8z"/><path d="M6.5 15h3.2M13.5 15.5h3.5" opacity=".55"/></svg></button>
    <button class="ib" id="bGs" type="button" title="가우시안 보기 (가우시안 스플래팅)" aria-label="가우시안" hidden><svg viewBox="0 0 24 24"><ellipse cx="9.5" cy="10" rx="6" ry="3.4" transform="rotate(-28 9.5 10)"/><ellipse cx="16" cy="15" rx="4.2" ry="2.4" transform="rotate(18 16 15)" opacity=".7"/><circle cx="7" cy="17.5" r="2" opacity=".5"/></svg></button>
    <button class="ib" id="bTop" type="button" title="위에서 보기" aria-label="위에서 보기"><svg viewBox="0 0 24 24"><path d="M12 3 4 8l8 5 8-5zM4 12l8 5 8-5M4 16l8 5 8-5"/></svg></button>
    <button class="ib on" id="tgSide" type="button" title="오른쪽 칸 (지하 시설물)" aria-label="오른쪽 칸"><svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2"/><path d="M14.5 4.5v15"/></svg></button>
  </div>
</header>
<aside id="side">
  <section id="ugPane" class="pane">
    <div class="ugHead"><b>지하 시설물</b><span id="ugTag" class="tag" title="설계값 아님 · 보기용 값"></span><button id="tgShore" class="ib s" type="button" title="가시설 (흙막이)" aria-label="가시설"><svg viewBox="0 0 24 24"><path d="M2 5h4M18 5h4"/><path d="M6 5v15M18 5v15"/><path d="M6 10h12"/></svg></button></div>
    <div id="ugMode" class="seg4" role="group" aria-label="표현">

      <button id="mDepth" type="button" title="터파기 · 시공 구덩이 3D"><svg viewBox="0 0 24 24"><path d="M2 8h4l2.5 10h7L18 8h4"/><circle cx="12" cy="15" r="2"/></svg><span>터파기</span></button>
      <button id="tgSec" class="act" type="button" title="터파기 단면 설정" aria-label="단면"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9.5h16"/><circle cx="12" cy="14.5" r="2.5"/></svg><span>단면</span></button>

        <button id="shHpile" data-t="hpile" type="button" title="토류벽 흙막이 (H형강 + 토류판) · 관 위 두 점" aria-label="토류벽 흙막이"><svg viewBox="0 0 24 24"><path d="M3 4v16M7 4v16M3 12h4M17 4v16M21 4v16M17 12h4"/><path d="M7 8h10M7 12h10M7 16h10" opacity=".55"/></svg><span>토류벽</span></button>
        <button id="shSheet" data-t="sheet" type="button" title="시트파일 · 관 위 두 점" aria-label="시트파일"><svg viewBox="0 0 24 24"><path d="M2 8h3l2 8h4l2-8h4l2 8h3"/></svg><span>시트파일</span></button>

    <div class="dlgBody">
      <div class="fileRow"><button id="pmPick" type="button">파일 고르기</button><span id="pmFile"></span></div>

        <label>관경 항목 (mm)<select id="pmDia"></select></label>
