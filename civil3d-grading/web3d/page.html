<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>__TITLE__</title>
<style>
:root{
  --panel:rgba(26,29,34,.86); --panel2:rgba(40,44,51,.92); --line:rgba(255,255,255,.10);
  --text:#eef0f3; --dim:#a9b0ba; --accent:#ff8a1f; --accent2:#3d8bff; --warn:#ffcc33; --bad:#ff6b5b;
  --r:10px; --shadow:0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1b1e23;color:var(--text);
  font:14.5px/1.45 "Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;-webkit-user-select:none;user-select:none;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#view{position:absolute;inset:0;background:linear-gradient(#6f9fd3 0%,#a9c6e6 38%,#d9e4ee 62%,#e4eaee 100%)}
#view canvas{display:block;width:100%;height:100%;outline:none}
.pnl{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);backdrop-filter:blur(6px)}
button{font:inherit;color:var(--text);background:transparent;border:0;border-radius:7px;padding:6px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover{background:rgba(255,255,255,.09)}
button.on{background:rgba(255,138,31,.22);color:#ffd2a8}
button:disabled{opacity:.4;cursor:default}
svg{width:16px;height:16px;flex:none}
#top{position:absolute;left:10px;right:10px;top:10px;display:flex;align-items:center;gap:6px;padding:4px 6px;flex-wrap:wrap;z-index:10}
#top .grow{flex:1}
#top .sep{width:1px;height:20px;background:var(--line);margin:0 2px}
#stamp{color:var(--dim);font-size:12px;padding:0 6px;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
#warnBtn{color:var(--warn)}
#side{position:absolute;left:10px;top:62px;width:190px;padding:6px;max-height:calc(100% - 180px);overflow:auto}
#side.closed .body{display:none}
#side .hd{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 4px;color:var(--dim);font-size:12px}
.lay{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:7px;cursor:pointer}
.lay:hover{background:rgba(255,255,255,.07)}
.lay .sw{width:12px;height:12px;border-radius:3px;border:1px solid rgba(255,255,255,.35)}
.lay input{margin:0;accent-color:var(--accent)}
.lay.off{opacity:.5}
.lay.miss{opacity:.45;cursor:default}
.lay .wn{color:var(--warn);margin-left:auto}
#bl{position:absolute;left:10px;bottom:10px;display:flex;flex-direction:column;align-items:stretch;gap:8px;pointer-events:none}
#bl>.pnl{pointer-events:auto}
#drainLg{padding:7px 10px 8px;display:none;font-size:12px;color:var(--dim);min-width:170px}
#drainLg .hd{display:flex;align-items:center;justify-content:space-between;color:var(--text);font-size:13px;margin-bottom:3px}
#drainLg .k{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:2px}
#drainLg i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
#drainLg i.flow{height:4px;background:repeating-linear-gradient(90deg,#cfeeff 0 3px,#1e7bff 3px 10px);background-size:10px 4px;animation:flow .6s linear infinite}
@keyframes flow{to{background-position:10px 0}}
#slopeLg{padding:7px 10px 8px;display:none;font-size:12px;color:var(--dim);width:236px}
#slopeLg .hd{display:flex;align-items:baseline;justify-content:space-between;color:var(--text);font-size:13px;margin-bottom:5px}
#slopeLg .hd span{color:var(--dim);font-size:11.5px}
#slopeBar{height:9px;border-radius:5px;margin:0 8px}
#slopeTick{position:relative;height:15px;margin:2px 8px 0;font-size:10.5px}
#slopeTick span{position:absolute;transform:translateX(-50%);white-space:nowrap}
#dock .lg{gap:14px;font-size:12px;color:var(--dim)}
#dock .lg i{display:inline-block;width:16px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
#dock .lg i.ln{height:3px;border-radius:0}
#shareAsk{position:absolute;left:50%;top:70px;transform:translateX(-50%);width:min(440px,calc(100% - 20px));padding:10px 14px 12px;display:none;z-index:8}
#shareAsk .t{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
#shareAsk p{margin:4px 0;word-break:keep-all}
#shareAsk .d{color:var(--dim);font-size:13px}
#shareAsk .row{display:flex;justify-content:flex-end;gap:6px;margin-top:10px}
#shareAsk .go{background:rgba(61,139,255,.25);color:#cfe0ff}
#dock{position:absolute;left:50%;transform:translateX(-50%);bottom:58px;width:min(600px,calc(100% - 20px));padding:8px 10px;display:none;z-index:6}
#dock .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#dock .row+.row,#dock .stages{margin-top:6px}
#dock .grow{flex:1}
#dock .t{font-weight:700}
#dock .v{color:var(--dim);font-variant-numeric:tabular-nums}
#dock input[type=range]{flex:1;min-width:140px;accent-color:var(--accent)}
#dock input[type=date]{background:rgba(0,0,0,.25);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font:inherit;color-scheme:dark}
#dock .b{background:rgba(61,139,255,.2);color:#cfe0ff}
#dock .stages{display:flex;justify-content:space-between;color:var(--dim);font-size:12.5px;padding:0 4px}
#dock .stages span.on{color:#ffd2a8;font-weight:700}
#dock .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;flex:1;min-width:140px}
#dock .bar>div{height:100%;width:0;background:var(--accent)}
#nav .sep{width:1px;height:20px;background:var(--line);margin:0 3px}
@media (max-width:900px){body.docked #bl{display:none}}
#legend{margin:6px 4px 2px;display:none}
#legend .bar{height:10px;border-radius:5px;background:linear-gradient(90deg,#cc2a1f,#f4f4f0,#265ccc)}
#legend .ends{display:flex;justify-content:space-between;color:var(--dim);font-size:11px;margin-top:2px}
#nav{position:absolute;right:10px;bottom:10px;display:flex;align-items:center;gap:2px;padding:4px}
#compass{width:34px;height:34px;padding:0;justify-content:center}
#compass svg{width:28px;height:28px;transition:none}
#earth{padding:8px 12px;display:none;min-width:170px}
#earth table{border-collapse:collapse}
#earth td{padding:1px 0}
#earth td:last-child{text-align:right;padding-left:14px;font-variant-numeric:tabular-nums}
#earth .k{color:var(--dim)}
.cut{color:#ff8f80}.fill{color:#8fb6ff}
#info,#measure{position:absolute;padding:8px 10px;min-width:180px;max-width:300px;display:none;z-index:5}
#info .t,#measure .t{font-weight:700;margin-bottom:4px;display:flex;justify-content:space-between;gap:10px;align-items:center}
#info table,#measure table{border-collapse:collapse;width:100%}
#info td,#measure td{padding:1px 0;vertical-align:top}
#info td:first-child,#measure td:first-child{color:var(--dim);padding-right:12px;white-space:nowrap}
#info td:last-child,#measure td:last-child{text-align:right;font-variant-numeric:tabular-nums}
#info .acts{margin-top:6px;display:flex;justify-content:flex-end;gap:4px;flex-wrap:wrap}
#info .acts button{background:rgba(61,139,255,.2);color:#cfe0ff}
#measure{right:10px;top:62px}
.x{padding:2px 6px;color:var(--dim)}
#warnList{position:absolute;right:10px;top:62px;width:min(520px,calc(100% - 20px));max-height:60%;overflow:auto;padding:8px 10px;display:none;z-index:6}
#warnList li{margin:3px 0;color:#ffe9a8}
#warnList ul{margin:4px 0 0 16px;padding:0}
#menu{position:absolute;display:none;padding:4px;z-index:7;flex-direction:column;min-width:170px}
#menu button{justify-content:flex-start;width:100%}
#menu button.sub{color:var(--dim);font-size:12px;border-top:1px solid var(--line);border-radius:0 0 7px 7px}
#busy,#err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,22,26,.55);z-index:9}
#busy .box,#err .box{padding:16px 20px;display:flex;align-items:center;gap:12px;max-width:80%}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:var(--accent);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#err{display:none}
#share{position:absolute;left:50%;top:70px;transform:translateX(-50%);width:min(560px,calc(100% - 20px));padding:10px 12px;display:none;z-index:8}
#share input{width:100%;margin:6px 0;padding:7px 9px;border-radius:7px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--text);font:inherit;-webkit-user-select:text;user-select:text}
#share .row{display:flex;gap:6px}
#share .row button{background:rgba(61,139,255,.2);color:#cfe0ff}
#shareNote{color:var(--dim);font-size:12px;margin-top:6px}
#toast{position:absolute;left:50%;transform:translateX(-50%);top:62px;padding:8px 14px;display:none;z-index:8;max-width:80%}
#attrib{position:absolute;right:12px;bottom:58px;font-size:10px;color:rgba(255,255,255,.75);text-shadow:0 1px 2px rgba(0,0,0,.6);display:none;pointer-events:none}
#err .box{color:#ffd0c8}
.host{display:none}
body.inhost .host{display:inline-flex}
@media (max-width:640px){#side{width:160px}#stamp{display:none}}
</style>
</head>
<body>
<div id="view"></div>

<div id="top" class="pnl">
  <button id="sideBtn" title="층"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="m2 13 10 5 10-5"/></svg></button>
  <span class="sep"></span>
  <button id="modeInfo" class="on" title="누르면 정보"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>정보</button>
  <button id="modeMeasure" title="두 점 재기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 17 14-14 4 4L7 21l-4-4Z"/><path d="m7 13 2 2M10 10l2 2M13 7l2 2"/></svg>재기</button>
  <span class="grow"></span>
  <span id="stamp"></span>
  <button id="warnBtn" style="display:none" title="자가진단"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 2 21h20L12 3Z"/><path d="M12 10v5M12 18v.5"/></svg><span id="warnN"></span></button>
  <button id="refreshBtn" class="host" title="다시 만들기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>새로고침</button>
  <button id="saveBtn" class="host" title="저장"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M4 17v3h16v-3"/></svg>저장</button>
</div>

<div id="side" class="pnl">
  <div class="hd"><span>층</span><button class="x" id="sideClose">✕</button></div>
  <div class="body"><div id="layers"></div>
    <div id="legend"><div class="bar"></div><div class="ends"><span id="lgCut"></span><span>0</span><span id="lgFill"></span></div></div>
  </div>
</div>

<div id="bl">
  <div id="slopeLg" class="pnl"><div class="hd"><b>경사</b><span>화살표 = 내리막</span></div><div id="slopeBar"></div><div id="slopeTick"></div></div>
  <div id="drainLg" class="pnl"><div class="hd"><b>빗물</b><button class="x" id="drainRe" title="고임 다시 채우기">↻</button></div><div class="k"><span><i class="flow"></i>물길</span><span><i style="background:#2f86d6;opacity:.75"></i>고임</span><span><i style="background:radial-gradient(circle,#7dd7ff 35%,transparent 40%);background-size:6px 6px"></i>평지</span></div><span id="drainSum"></span></div>
  <div id="earth" class="pnl"><table id="earthT"></table></div>
</div>

<div id="nav" class="pnl">
  <button id="fitBtn" title="전체"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button id="topBtn" title="위에서"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M12 8v8M8 12h8"/></svg></button>
  <button id="shadowBtn" class="on" title="그림자"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="9" r="4"/><path d="M9 13c0 4 4 7 11 7"/></svg></button>
  <button id="compass" title="북쪽 위로"><svg viewBox="0 0 32 32"><g id="needle"><path d="M16 3 20 16h-8Z" fill="#ff5b4a"/><path d="M16 29 12 16h8Z" fill="#d7dbe1"/></g><circle cx="16" cy="16" r="2" fill="#1b1e23"/></svg></button>
  <span class="sep"></span>
  <button id="sunBtn" title="해 그림자"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  <button id="buildBtn" title="시공 순서"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20h18"/><path d="M5 20v-5h4v5M10 20V10h4v10M15 20V5h4v15"/></svg></button>
  <button id="videoBtn" title="드론 비행 영상(20초)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg></button>
  <button id="photoBtn" title="사진(3D만)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4Z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
</div>
<div id="dock" class="pnl"></div>

<div id="info" class="pnl"><div class="t"><span id="infoT"></span><button class="x" id="infoX">✕</button></div><table id="infoTb"></table><div class="acts" id="infoActs"></div></div>
<div id="measure" class="pnl"><div class="t"><span>재기</span><button class="x" id="measX">✕</button></div><table id="measTb"></table></div>
<div id="warnList" class="pnl"><div class="t" style="display:flex;justify-content:space-between"><b>자가진단</b><button class="x" id="warnX">✕</button></div><ul id="warnUl"></ul></div>
<div id="menu" class="pnl"><button data-save="share">웹 주소로 공유</button><button data-save="html">3D 파일</button><button data-save="infra">InfraWorks 파일</button><button data-save="shareset" class="sub">웹 공유 설정 · 올린 것</button></div>
<div id="share" class="pnl"><div class="t" style="display:flex;justify-content:space-between;align-items:center"><b>웹 주소</b><button class="x" id="shareX">✕</button></div>
  <input id="shareUrl" readonly><div class="row"><button id="shareCopy">복사</button><button id="shareOpen">브라우저로 열기</button></div><div id="shareNote"></div></div>
<div id="shareAsk" class="pnl"><div class="t"><b>웹 주소로 공유</b><button class="x" id="askX">✕</button></div>
  <p>이 3D 화면(HTML 파일 하나)을 개발자 NAS에 올려 주소로 나눕니다.</p>
  <p class="d">주소를 아는 사람은 누구나 볼 수 있으니, 민감한 현장은 [3D 파일]로 저장해 직접 전달하세요.</p>
  <div class="row"><button id="askNo">닫기</button><button id="askGo" class="go">계속</button></div></div>
<div id="toast" class="pnl"></div>
<div id="attrib">위성 © VWorld</div>
<div id="busy"><div class="box pnl"><div class="spin"></div><span id="busyT">불러오는 중</span></div></div>
<div id="err"><div class="box pnl"><span id="errT"></span></div></div>

<script id="dh3d-data" type="application/octet-stream">__DATA__</script>
<script>
/*__VIEWER__*/
</script>
</body>
</html>
